<script>
(() => {
  const API = "https://data.cityofnewyork.us/resource/43nn-pn8j.json";
  const $  = s => document.querySelector(s);
  const out = $("#out");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const titleCase = s => String(s ?? "").toLowerCase().replace(/\b[a-z]/g, m => m.toUpperCase());

  // DOHMH's own published cut points. Not ours.
  const BANDS = [{g:"A", lo:0,  hi:13, c:"ok"},
                 {g:"B", lo:14, hi:27, c:"watch"},
                 {g:"C", lo:28, hi:100, c:"act"}];
  const bandFor = s => BANDS.find(b => s >= b.lo && s <= b.hi) || BANDS[2];

  // Our grouping, not DOHMH's. Built from the paired-inspection work. The
  // "needs money and a contractor" explanation was TESTED against each
  // building's own DOB record (dob_contractor_test.py): persistence is
  // identical in troubled and clean buildings, so the copy below claims
  // the measured fact and not the money story.
  const GROUPS = [
    { key:"building", h:"Pests and the building",
      note:"The slow kind. In 6,990 paired NYC inspections, about 4 in 10 of these were still there "
         + "at the re-inspection. We tested whether buildings with open DOB violations explain it - "
         + "they don't. Something makes these stick, and the data hasn't told us what yet.",
      test: c => /^(04[KLMN]|08[AB]|10[A-J])/.test(c) },
    { key:"handling", h:"Food handling and staff",
      note:"Fixable by next shift. In the same paired inspections, roughly 1 in 4 of these came back.",
      test: c => /^(02|03|04[A-J]|05|06|09)/.test(c) },
    { key:"admin", h:"Paperwork, signage and everything else",
      note:"Administrative findings. They add points but say little about the kitchen.",
      test: () => true },
  ];

  // ---- BEGIN GENERATED by build_pages.py - do not hand-edit ----
  // Source: agrade_test.json, written by agrade_test.py.
  // 4,110 A grades confirmed earned on a re-inspection that
  // answered a failed initial, vs 16,674 earned on an initial.
  const AGRADE = {"censored":19672,"dataset":"43nn-pn8j","failScore":14,"initialN":16674,"initialRate":0.2887,"lookbackDays":180,"paired":25103,"reinspN":4110,"reinspRate":0.4667,"watermark":"Tue, 11 Aug 2026 22:11:54 GMT"};
  // ---- END GENERATED ----

  // ---- BEGIN GENERATED-IRC by build_pages.py - do not hand-edit ----
  // Source: irc_validation_result.json (immutable one-shot) + irc_prereg.json.
  // H1 PASS on the untouched window, 28.6% vs 46.0%.
  const IRC = {"abstainAfterDays":730,"failScore":14,"limitedOutcomes":3114,"limitedRatePct":46.0,"lookbackDays":180,"methodologyVersion":"1.0.0-candidate","registration":"64c5bcd80c34f5e7ede884ab7f1ca9ccd382b940","strongOutcomes":4614,"strongRatePct":28.6,"validatedOn":"2026-08-12","verdict":"pass"};
  // ---- END GENERATED-IRC ----

  // Inspection Record Confidence, in the browser. Mirrors irc_engine.py's
  // registered mapping exactly; irc_ui_parity_test.cjs replays the shared
  // fixture through THIS code against the Python expectations, so drift
  // between the two implementations fails the build (the GUARD 10 lesson).
  //
  // The walk below intentionally repeats reinspectionAContext's logic rather
  // than wrapping it: the node harnesses extract each function by name and
  // eval it standalone, so every tested function must be self-contained.
  //
  // The reserved middle level appears nowhere in this map. It is unearned -
  // a gate proves no route can emit it.
  const IRC_LEVEL = {
    ORIGIN_INITIAL: "strong",
    ORIGIN_REINSP_CONFIRMED_FAILED_INITIAL: "limited",
    ORIGIN_REINSP_AFTER_PASSED_INITIAL: "limited",
    ORIGIN_REINSP_UNCONFIRMED_FAILS_CLOSED: "limited",
    ORIGIN_OTHER_CYCLE_FAILS_CLOSED: "limited",
  };
  const IRC_LABEL = {strong: "Strong", limited: "Limited",
                     not_enough_current_evidence: "Not enough current evidence"};
  const IRC_COPY = {
    ORIGIN_INITIAL: "This A was earned on an initial inspection.",
    ORIGIN_REINSP_CONFIRMED_FAILED_INITIAL: "This A followed a confirmed failed initial inspection.",
    ORIGIN_REINSP_AFTER_PASSED_INITIAL: "This A was earned on a re-inspection; the initial before it had passed.",
    ORIGIN_REINSP_UNCONFIRMED_FAILS_CLOSED: "This A was earned on a re-inspection whose earlier history could not be confirmed, so the rating takes the cautious reading.",
    ORIGIN_OTHER_CYCLE_FAILS_CLOSED: "This A came from a cycle visit that was neither an initial inspection nor a re-inspection, so the rating takes the cautious reading.",
    EVIDENCE_TOO_OLD: "The newest usable record is over two years old, so this tool will not claim confidence either way.",
    NO_GRADED_RECORD: "No graded inspection is on file to rate.",
    A_EVENT_NOT_ELIGIBLE: "The displayed A did not come from a full cycle inspection, so there is nothing this rating can honestly grade.",
    DISPLAYED_GRADE_NOT_A: "Confidence levels apply to displayed A grades; a B or C already carries its own warning.",
  };

  function classifyIRC(dates, byDate, asofMs, cfg){
    cfg = cfg || IRC;
    const at = d => {
      const rs = byDate.get(d) || [];
      const s = rs.find(r => r.score != null)?.score;
      return {
        date: d,
        type: (rs.find(r => r.inspection_type)?.inspection_type || "").toLowerCase(),
        score: s == null ? null : Number(s),
        grade: (rs.find(r => r.grade)?.grade || "").trim().toUpperCase(),
      };
    };
    const graded = dates.map(at).filter(e => e.grade === "A" || e.grade === "B" || e.grade === "C");
    if (!graded.length) return {state: "not_enough_current_evidence", reason: "NO_GRADED_RECORD"};
    const disp = graded[0];                              // dates are newest-first
    if (disp.grade !== "A")
      return {state: "displayed_grade_not_a", reason: "DISPLAYED_GRADE_NOT_A", grade: disp.grade};
    const eligible = disp.score != null && disp.type.indexOf("cycle inspection") === 0
                     && disp.type.indexOf("reopen") === -1;
    if (!eligible) return {state: "not_enough_current_evidence", reason: "A_EVENT_NOT_ELIGIBLE"};
    const age = Math.floor((asofMs - Date.parse(disp.date + "T00:00:00Z")) / 864e5);
    if (age > cfg.abstainAfterDays)
      return {state: "not_enough_current_evidence", reason: "EVIDENCE_TOO_OLD", ageDays: age};

    let origin = "ORIGIN_OTHER_CYCLE_FAILS_CLOSED";
    if (disp.type.indexOf("initial") !== -1) origin = "ORIGIN_INITIAL";
    else if (disp.type.indexOf("re-inspection") !== -1){
      origin = "ORIGIN_REINSP_UNCONFIRMED_FAILS_CLOSED";
      const dispMs = Date.parse(disp.date + "T00:00:00Z");
      const later = dates.filter(d => d < disp.date);   // strictly before, newest-first
      for (let i = 0; i < later.length; i++){
        const prev = at(later[i]);
        if ((dispMs - Date.parse(prev.date + "T00:00:00Z")) / 864e5 > cfg.lookbackDays) break;
        if (!prev.type) break;                          // unclassifiable visit: fail closed
        if (prev.type.indexOf("initial") === -1) continue;
        if (prev.score == null) break;                  // cannot confirm it failed
        origin = prev.score >= cfg.failScore
          ? "ORIGIN_REINSP_CONFIRMED_FAILED_INITIAL"
          : "ORIGIN_REINSP_AFTER_PASSED_INITIAL";
        break;
      }
    }
    return {state: IRC_LEVEL[origin], reason: origin, ageDays: age};
  }

  const fmtDate = iso => new Date(iso).toLocaleDateString("en-US",
    {year:"numeric", month:"short", day:"numeric", timeZone:"UTC"});
  const daysAgo = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);

  // A fetch that never returns is worse than one that fails: the page waits
  // forever and the button stays dead. Twelve seconds is past the point where
  // anyone is still waiting, so we stop waiting for them.
  const TIMEOUT_MS = 12000;

  // Every failure carries a kind, because these are not one event. "You are
  // offline", "the city is refusing", and "the city sent us something that is
  // not data" are three different facts, and only one of them is about the
  // reader's connection. Collapsing them into one catch is how an outage ends
  // up printed as "no restaurant matched".
  const fail = (kind, message) => Object.assign(new Error(message), {kind});

  // The request currently holding a socket. A newer search cuts it loose.
  let inflight = null;

  async function api(params){
    const u = new URL(API);
    for (const [k,v] of Object.entries(params)) u.searchParams.set(k, v);

    if (inflight) inflight.abort();          // the old question is no longer being asked
    const ctl = inflight = new AbortController();
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctl.abort(); }, TIMEOUT_MS);

    // An abort surfaces the same way whether we timed it out or replaced it,
    // so the reason has to be read off our own flags, never off the exception.
    const aborted = err => {
      if (timedOut) return fail("timeout",
        `The city\u2019s API did not answer within ${TIMEOUT_MS/1000} seconds.`);
      if (err && err.name === "AbortError") return fail("superseded", "Replaced by a newer search.");
      return null;
    };

    try{
      let r;
      try{
        r = await fetch(u, {signal: ctl.signal});
      }catch(err){
        // fetch() rejects for exactly two reasons here: we cancelled it, or
        // the request never reached a server at all. A 503 does NOT land here.
        throw aborted(err) || fail("offline",
          "Could not reach the city\u2019s API at all.");
      }

      if (!r.ok) throw fail("status",
        `The city\u2019s API answered with an error: ${r.status} ${r.statusText || ""}`.trim() + ".");

      let body;
      try{
        body = await r.json();
      }catch(err){
        // The status line said 200 and then the body was not JSON. Usually a
        // gateway or an outage page answering in front of the real server.
        throw aborted(err) || fail("badbody",
          "The city\u2019s API answered, but what came back was not data.");
      }

      // A 200 is not a promise that the body is the thing we asked for. Socrata
      // returns its own errors as a JSON object, and an object has no .length -
      // so without this check a rejected query reads on screen as "no results".
      if (!Array.isArray(body)){
        const said = body && typeof body === "object" && typeof body.message === "string"
          ? body.message : null;
        throw fail("badshape", said
          ? `The city\u2019s API rejected the query: \u201c${said}\u201d`
          : "The city\u2019s API answered OK, but the body was not a list of inspection rows.");
      }

      return { rows: body, modified: r.headers.get("Last-Modified") };
    }finally{
      clearTimeout(timer);
      if (inflight === ctl) inflight = null;
    }
  }

  // Every fetch takes a ticket. A slow early request that lands after a fast
  // later one must not overwrite the newer answer, so stale tickets return
  // without touching the DOM.
  let ticket = 0;

  // #status and #out do two different jobs. #out holds the last answer the
  // city actually gave us. #status holds what is happening right now. Keeping
  // them apart is what makes it impossible for an error to delete a true
  // result - setBusy never touches #out's contents, only its dimming.
  function setBusy(on, msg){
    const btn = document.querySelector("#form button");
    btn.disabled = on;
    btn.textContent = on ? "Looking\u2026" : "Look it up";
    // The previous result stays put and dims; it is still true until replaced.
    out.classList.toggle("loading", on);
    if (on){
      $("#status").innerHTML = `<div class="msg">${msg}</div>`;
      // The footer stamps the provenance of what is ON SCREEN. Mid-fetch that
      // is the OLD result, so the stamp must not read as current.
      $("#foot").innerHTML =
        `<span style="opacity:.55">Checking the city&rsquo;s API&hellip; the stamp below returns with the answer.</span>`;
    }
    // Deliberately does NOT clear #status on the way out: by then #status may
    // be holding an error message that outlives the request that caused it.
  }

  // Every terminal answer comes through this one door: the status line clears,
  // the stale mark comes off, and #out becomes the newest true thing we have.
  function settle(html){
    $("#status").innerHTML = "";
    out.classList.remove("stale");
    out.innerHTML = html;
  }

  // What each failure actually means, in the reader's terms. The rule for
  // every line: say what happened, say whose fault it is, and never imply we
  // learned anything about the restaurant - because we didn't.
  const WHY = {
    timeout:  "That is almost always the city\u2019s server being slow, not your connection. We stopped waiting rather than leave you on a spinner.",
    offline:  "Either this device is offline or data.cityofnewyork.us is unreachable from here. Nothing was fetched, so nothing here changed.",
    status:   "That is their server refusing, not your search. Worth trying again in a minute.",
    badbody:  "Something answered in front of their server \u2014 usually a gateway or an outage page. We are not going to guess at what it meant.",
    badshape: "We asked for a list of inspections and got something else back. That is not the same as finding nothing, so we are not going to show it as an empty result.",
  };

  // Provenance of whatever is sitting in #out right now.
  let lastStamp = null;

  const PAGE_URL = "https://doble196.github.io/freshroute-demo/data-app/check.html";
  const mapsHref = h => "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(`${h.building || ""} ${h.street || ""}, ${h.boro || ""}, NYC`.trim());
  const deepLink = camis => `${PAGE_URL}?camis=${encodeURIComponent(camis)}`;

  async function shareCard(h, grade, confLabel, reasonCopy){
    const text = `${titleCase(h.dba)} \u2014 ${titleCase(`${h.building || ""} ${h.street || ""}`)}, ${h.boro}\n` +
      `City grade ${grade} \u00b7 Record confidence ${confLabel}\n${reasonCopy}\n${deepLink(h.camis)}`;
    try{
      if (navigator.share){ await navigator.share({text}); return; }
      await navigator.clipboard.writeText(text);
      $("#status").innerHTML = `<div class="msg">Copied to clipboard.</div>`;
      setTimeout(() => { if ($("#status").textContent.indexOf("Copied") !== -1) $("#status").innerHTML = ""; }, 2500);
    }catch(e){ /* user cancelled the share sheet - nothing to report */ }
  }

  // The compare tray lives on THIS DEVICE only (localStorage). It is a
  // comparison selector, not an account: nothing leaves the browser. Save
  // behind real authentication ships with a backend, not before.
  const TRAY_KEY = "irc_compare_v1";
  const tray = () => { try{ return JSON.parse(localStorage.getItem(TRAY_KEY)) || []; }catch(e){ return []; } };
  const setTray = t => { localStorage.setItem(TRAY_KEY, JSON.stringify(t.slice(0, 3))); paintTray(); };
  function paintTray(){
    const t = tray();
    const el = $("#tray");
    if (!t.length){ el.innerHTML = ""; return; }
    el.innerHTML = `<div class="cbar"><span><b>${t.length}</b> in compare (this device only)</span>` +
      (t.length >= 2 ? `<button id="cmpGo">Compare</button>` : `<span style="color:var(--ink3)">add one more to compare</span>`) +
      `<button id="cmpClear">Clear</button></div>`;
    const go = $("#cmpGo"); if (go) go.addEventListener("click", runCompare);
    $("#cmpClear").addEventListener("click", () => setTray([]));
  }

  async function runCompare(){
    const t = tray();
    const my = ++ticket;
    setBusy(true, "Fetching each location live for the comparison\u2026");
    try{
      const cols = [];
      for (const camis of t){
        const {rows} = await api({
          "camis": camis,
          "$select": "camis,dba,boro,building,street,inspection_date,score,grade,action,inspection_type",
          "$order": "inspection_date DESC", "$limit": "400",
        });
        if (!rows.length){ cols.push({camis, missing: true}); continue; }
        const byD = new Map();
        for (const r of rows){
          const d = (r.inspection_date || "").slice(0,10);
          if (!d || d === "1900-01-01") continue;
          if (!byD.has(d)) byD.set(d, []);
          byD.get(d).push(r);
        }
        const ds = [...byD.keys()].sort().reverse();
        const c = classifyIRC(ds, byD, Date.now());
        const curr = byD.get(ds[0]) || [];
        cols.push({
          camis, dba: rows[0].dba, addr: `${rows[0].building || ""} ${rows[0].street || ""}`,
          boro: rows[0].boro,
          grade: (curr.find(r => r.grade)?.grade || "\u2014"),
          conf: c, evDate: ds[0],
        });
      }
      if (my !== ticket) return;
      stampFoot(lastStamp);
      const levels = new Set(cols.filter(c => !c.missing).map(c => c.conf.state));
      const note = levels.size === 1
        ? "Same record confidence \u2014 choose based on the food, location, or available time."
        : "A more dependable inspection record does not mean better food, and it does not mean the other restaurant is currently unsafe.";
      settle(`<div class="panel"><div class="zone">
        <div class="lab">Compare \u00b7 no overall winner, on purpose</div>
        <div style="overflow-x:auto"><table class="ctable"><tr><th></th>${cols.map(c =>
          `<th>${esc(titleCase(c.dba || c.camis))}</th>`).join("")}</tr>
        <tr><td class="lab">Address</td>${cols.map(c => `<td>${c.missing ? "\u2014" :
          esc(titleCase(c.addr)) + " \u00b7 " + esc(c.boro)}</td>`).join("")}</tr>
        <tr><td class="lab">City grade</td>${cols.map(c => `<td><b>${c.missing ? "?" : esc(c.grade)}</b></td>`).join("")}</tr>
        <tr><td class="lab">Record confidence</td>${cols.map(c => `<td>${c.missing ? "no record" :
          `<b class="conf-${c.conf.state === "strong" ? "strong" : c.conf.state === "limited" ? "limited" : "abstain"}">${IRC_LABEL[c.conf.state] || "n/a"}</b>`}</td>`).join("")}</tr>
        <tr><td class="lab">Why</td>${cols.map(c => `<td>${c.missing ? "\u2014" :
          esc(IRC_COPY[c.conf.reason] || "")}</td>`).join("")}</tr>
        <tr><td class="lab">Evidence date</td>${cols.map(c => `<td>${c.missing ? "\u2014" : fmtDate(c.evDate)}</td>`).join("")}</tr>
        <tr><td class="lab"></td>${cols.map(c => `<td>${c.missing ? "" :
          `<a href="${mapsHref({building: c.addr, street: "", boro: c.boro})}" target="_blank" rel="noopener">Directions</a> \u00b7 <a href="${deepLink(c.camis)}">Open</a>`}</td>`).join("")}</tr>
        </table></div>
        <p style="margin:10px 0 0;font-size:12.5px;color:var(--ink2)">${note}</p>
      </div></div>`);
    }catch(e){
      if (my !== ticket || e.kind === "superseded") return;
      renderError(e);
    }finally{
      if (my === ticket) setBusy(false);
    }
  }

  function renderError(e){
    const stale = out.innerHTML.trim().length > 0;
    $("#status").innerHTML =
      `<div class="msg err"><span class="hdr">${esc(e.message)}</span>
         <span class="why">${esc(WHY[e.kind] || "")}</span>
         ${stale ? `<span class="why">The result below is the answer to your <i>previous</i> search. It is still true \u2014 it just is not the thing you asked for.</span>` : ""}</div>`;
    // #out is untouched on purpose. But it must stop looking current.
    if (stale){ out.classList.add("stale"); stampFoot(lastStamp, true); }
    else $("#foot").innerHTML =
      `<span style="opacity:.7">No stamp: nothing on this screen came from the city, so there is
       no provenance to show.</span>`;
  }

  // Five words that are not restaurant names. This search matches dba (the
  // business name), so "Brooklyn" returns Brooklyn Diner - not Brooklyn.
  // Confidently wrong is worse than empty, so say so before showing results.
  const BOROS = new Set(["BROOKLYN","QUEENS","MANHATTAN","BRONX","STATEN ISLAND","THE BRONX","NYC","NEW YORK"]);

  async function search(term){
    const t = term.toUpperCase().replace(/'/g, "''");
    const my = ++ticket;
    setBusy(true, `Asking the city&rsquo;s API for &ldquo;${esc(term)}&rdquo;&hellip;`);
    try{
      const {rows, modified} = await api({
        "$select":"camis,dba,boro,building,street",
        "$where":`upper(dba) like '%${t}%'`,
        "$group":"camis,dba,boro,building,street",
        "$limit":"15",
      });
      if (my !== ticket) return;          // a newer search already won
      stampFoot(modified);

      // A borough typed into a name box matches names, not places. Name it.
      const boroNote = BOROS.has(term.trim().toUpperCase())
        ? `<div class="notice"><b>&ldquo;${esc(term)}&rdquo; is a place, not a restaurant name.</b><br>
             This box searches the name over the door, so these are restaurants with
             &ldquo;${esc(term)}&rdquo; <i>in their name</i> &mdash; not the ones located there.
             Looking up a whole borough is a different question than this tool answers:
             it checks one restaurant at a time.</div>`
        : "";

      // Zero rows has two completely different causes and the screen cannot
      // tell them apart, so it must not offer only the flattering one. A place
      // that failed and shut down is DELETED from this dataset - it comes back
      // looking exactly like a place that never existed.
      if (!rows.length){
        settle(boroNote + `<div class="msg"><b>Nothing in the city&rsquo;s file matches
          &ldquo;${esc(term)}&rdquo;.</b> Two very different things do that, and this screen
          cannot tell you which one you hit.
          <br><br><b>1. The spelling.</b> The city files names in caps and usually without
          punctuation &mdash; Joe&rsquo;s Pizza is stored as JOES PIZZA. Try a shorter piece of the name.
          <br><br><b>2. It closed.</b> This dataset only holds restaurants that are still open.
          When one shuts down, the city takes its whole inspection history out with it. So a
          restaurant that failed hard and closed looks identical to a restaurant that never
          existed: empty. The worst records are the ones you cannot see.</div>`);
        return;
      }
      if (rows.length === 1 && !boroNote) return show(rows[0].camis);
      settle(boroNote + `<div class="results">` + rows.map(r =>
        `<button data-camis="${esc(r.camis)}">
           <div class="nm">${esc(titleCase(r.dba))}</div>
           <div class="ad">${esc(titleCase(`${r.building||""} ${r.street||""}`))} &middot; ${esc(r.boro)}</div>
         </button>`).join("") + `</div>`);
    }catch(e){
      if (my !== ticket || e.kind === "superseded") return;
      renderError(e);
    }finally{
      if (my === ticket) setBusy(false);
    }
  }

  async function show(camis){
    const my = ++ticket;
    setBusy(true, "Loading the inspection history&hellip;");
    try{
      const {rows, modified} = await api({
        "camis":camis,
        "$select":"camis,dba,boro,building,street,cuisine_description,inspection_date,score,grade,action,"
                + "violation_code,violation_description,critical_flag,inspection_type",
        "$order":"inspection_date DESC",
        "$limit":"400",
      });
      if (my !== ticket) return;          // superseded by a newer lookup
      stampFoot(modified);
      if (!rows.length){ settle(`<div class="msg">The city has no inspection rows for this record.</div>`); return; }
      render(rows, modified);
    }catch(e){
      if (my !== ticket || e.kind === "superseded") return;
      renderError(e);
    }finally{
      if (my === ticket) setBusy(false);
    }
  }

  // Was the A on screen earned on a re-inspection that answered a FAILED
  // initial? Returns that initial, or null.
  //
  // Conservative by construction. Every branch that cannot be confirmed from
  // the record returns null and the flag stays off: no visit type, a visit
  // type we cannot classify anywhere in the chain, no parent initial inside
  // the lookback, or a parent initial with no score. Guessing would put a
  // restaurant into a bucket whose rate was measured on a different
  // population - the number would then be about somebody else.
  //
  // The rules here mirror earned_on() in agrade_test.py exactly, because the
  // percentages this flag prints were measured with those rules. GUARD 14
  // fails the build if the two drift.
  function reinspectionAContext(dates, byDate, cfg){
    cfg = cfg || AGRADE;
    if (!dates || dates.length < 2) return null;
    const at = d => {
      const rs = byDate.get(d) || [];
      const s = rs.find(r => r.score != null)?.score;
      return {
        date: d,
        type: (rs.find(r => r.inspection_type)?.inspection_type || "").toLowerCase(),
        score: s == null ? null : Number(s),
        grade: (rs.find(r => r.grade)?.grade || "").trim().toUpperCase(),
      };
    };
    const cur = at(dates[0]);
    if (cur.grade !== "A") return null;                 // not an A on display
    if (!cur.type) return null;                         // visit type unknown
    if (cur.type.indexOf("re-inspection") === -1) return null;

    const curMs = Date.parse(cur.date + "T00:00:00Z");
    for (let i = 1; i < dates.length; i++){
      const prev = at(dates[i]);
      if ((curMs - Date.parse(prev.date + "T00:00:00Z")) / 864e5 > cfg.lookbackDays) return null;
      if (!prev.type) return null;                      // unclassifiable visit in between
      if (prev.type.indexOf("initial") === -1) continue; // walk past other visits
      if (prev.score == null) return null;              // cannot confirm it failed
      return prev.score >= cfg.failScore ? prev : null;
    }
    return null;                                        // no parent initial in range
  }

  function render(rows, modified){
    const head = rows[0];
    // one inspection = one camis + date. Rows are violations within it.
    const byDate = new Map();
    for (const r of rows){
      const d = (r.inspection_date || "").slice(0,10);
      if (!d || d === "1900-01-01") continue;      // the city's null-date sentinel
      if (!byDate.has(d)) byDate.set(d, []);
      byDate.get(d).push(r);
    }
    const dates = [...byDate.keys()].sort().reverse();
    if (!dates.length){ settle(`<div class="msg">Every inspection on this record carries the city&rsquo;s placeholder date, so there is nothing datable to show.</div>`); return; }

    const cur = byDate.get(dates[0]);
    const scoreRaw = cur.find(r => r.score != null)?.score;
    const score = scoreRaw == null ? null : Number(scoreRaw);
    const grade = cur.find(r => r.grade)?.grade || null;
    const action = cur.find(r => r.action)?.action || null;
    const itype  = cur.find(r => r.inspection_type)?.inspection_type || null;

    const conf = classifyIRC(dates, byDate, Date.now());

    // real violations only - an action-only row has no violation code
    const viols = cur.filter(r => r.violation_code);
    const crit  = viols.filter(r => r.critical_flag === "Critical").length;

    const band = score == null ? null : bandFor(score);
    const gradeWord = {A:"A", B:"B", C:"C", Z:"Grade pending", N:"Not yet graded", P:"Re-opening pending"}[grade] || null;
    // A pending grade or a visit with no recorded violations is not a verdict
    // on the kitchen - the pill must never dress it in a verdict's colour.
    const caveat = ["Z","N","P"].includes(grade) || viols.length === 0;

    // ---- context first, then the number -------------------------------
    let html = `<div class="panel">
      <div class="zone ctx">
        <div class="what">${esc(titleCase(head.dba))}</div>
        <div class="dir">${esc(titleCase(`${head.building||""} ${head.street||""}`))} &middot; ${esc(head.boro)}${
          head.cuisine_description ? " &middot; " + esc(head.cuisine_description) : ""}</div>
      </div>

      <div class="zone">
        <div class="regs">
          <div class="reg">
            <div class="lab">City grade</div>
            <div class="rv">${grade ? esc(grade) : "\u2014"}</div>
            <div class="rr">the city&rsquo;s letter, shown as posted</div>
          </div>
          <div class="reg">
            <div class="lab">Record confidence</div>
            <div class="rv conf-${conf.state === "strong" ? "strong" : conf.state === "limited" ? "limited" : "abstain"}">${
              esc(IRC_LABEL[conf.state] || "Not applicable")}</div>
            <div class="rr">${esc(IRC_COPY[conf.reason] || "")}
              ${conf.state === "strong" || conf.state === "limited"
                ? `<a href="#found">See the supporting inspection rows below.</a>` : ""}</div>
          </div>
        </div>
        <div class="rr" style="margin-top:10px;font-size:12.5px;color:var(--ink2)">
          It says how sure we can be &mdash; not how good the restaurant is. Inspection Record
          Confidence shows how much the available inspection history lets you lean on the city
          grade. It rates the evidence, not the kitchen.</div>
        <div class="actions">
          <a href="${mapsHref(head)}" target="_blank" rel="noopener">Directions</a>
          <button type="button" id="actShare">Share</button>
          <button type="button" id="actCompare">Add to compare</button>
        </div>
      </div>

      <div class="zone">
        <div class="what" style="font-size:15px;font-weight:660">Lower is better. Points are bad.</div>
        <div class="dir" style="font-size:13.5px;color:var(--ink2);margin-top:2px">
          The city gives an <b>A at 13 points or fewer</b>, a B up to 27, a C at 28 and above.</div>`;

    if (score == null){
      html += `<div class="bignum"><span class="n">&mdash;</span>
                 <span class="of">the city recorded no score for this visit</span></div>`;
    } else {
      const pos = Math.min(score, 100);
      html += `
        <div class="track">
          <div class="rail"></div>
          <div class="seg3" style="left:0%;width:13%;background:var(--ok);border-radius:3px 0 0 3px"></div>
          <div class="seg3" style="left:14%;width:13%;background:var(--watch)"></div>
          <div class="seg3" style="left:28%;width:72%;background:var(--act);border-radius:0 3px 3px 0"></div>
          <div class="mark" style="left:${pos}%" data-v="${score}"></div>
        </div>
        <div class="ends"><span class="mono">0 &middot; A</span><span class="mono">14 &middot; B</span>
          <span class="mono">28+ &middot; C</span><span class="mono">100</span></div>
        <div class="bignum">
          <span class="n">${score}</span><span class="of">points</span>
          <span class="pill" style="color:var(--${caveat ? "watch" : band.c})"><span class="dot"></span>${
            caveat ? "Not a full inspection"
                   : gradeWord ? esc(gradeWord) : "in the " + band.g + " range"}</span>
        </div>`;
    }

    html += `<div class="says">Inspected <b>${fmtDate(dates[0])}</b> &mdash; ${daysAgo(dates[0])} days ago${
      itype ? ` &middot; ${esc(itype)}` : ""}.</div>`;

    // The single most important piece of context on the whole screen: a low
    // score from a re-opening visit is not a clean bill of health.
    if (action && !/violations were cited/i.test(action)){
      html += `<div class="warn"><b>Read this before you read the number.</b><br>
        The city logged this visit as: &ldquo;${esc(action)}&rdquo;${
          viols.length === 0 ? ", and recorded no violations at all" : ""}.
        ${score === 0 || viols.length === 0
          ? "A visit like that is not a full inspection, so a low score here does not mean the kitchen was re-checked top to bottom."
          : ""}</div>`;
    }

    // Same letter in the window, materially different record behind it. Written
    // as an observation about past inspections: no causal claim, no statement
    // about this kitchen today, and denominators printed next to every rate.
    const parentFail = reinspectionAContext(dates, byDate);
    if (parentFail){
      const pct = r => (100 * r).toFixed(1) + "%";
      html += `<div class="warn"><b>This A followed a re-inspection.</b><br>
        The city logged this visit as a re-inspection. The initial inspection before it, on
        <b>${fmtDate(parentFail.date)}</b>, scored <b>${parentFail.score}</b>.
        In the analyzed inspection history, <b>${pct(AGRADE.reinspRate)}</b> of the
        ${AGRADE.reinspN.toLocaleString()} A grades earned this way were followed by a
        B-or-worse score at the next full inspection, compared with
        <b>${pct(AGRADE.initialRate)}</b> of the ${AGRADE.initialN.toLocaleString()} A grades
        earned on an initial inspection.
        <br><br>This does not predict this restaurant&rsquo;s current condition, and nothing here
        says the re-inspection caused a later result. It is context the displayed grade alone
        cannot show.
        <span style="display:block;margin-top:7px;font-size:11.5px;color:var(--ink3)">
          Measured from NYC OpenData <code>${esc(AGRADE.dataset)}</code>, publisher stamp
          <b>${esc(AGRADE.watermark || "not disclosed")}</b> &middot; method
          <code>agrade_test.py</code>, ${AGRADE.lookbackDays}-day lookback,
          ${AGRADE.paired.toLocaleString()} A grades paired.</span></div>`;
    }
    html += `</div>`;

    // ---- compared to what: this restaurant's own history ---------------
    const hist = dates.slice(0,6).map(d => {
      const rs = byDate.get(d);
      const s = rs.find(r => r.score != null)?.score;
      return {d, s: s == null ? null : Number(s), g: rs.find(r => r.grade)?.grade || null};
    });
    const maxS = Math.max(30, ...hist.map(h => h.s ?? 0));
    html += `<div class="zone">
      <div class="lab">This restaurant&rsquo;s own last ${hist.length} visit${hist.length>1?"s":""}</div>
      <div class="hist">` + hist.map((h,i) => {
        const c = h.s == null ? "ink3" : bandFor(h.s).c;
        return `<div class="hrow${i===0?" cur":""}">
          <span class="hd">${fmtDate(h.d)}</span>
          <span class="hbar"><i style="width:${h.s==null?0:Math.max(2,h.s/maxS*100)}%;background:var(--${c})"></i></span>
          <span class="hs" style="color:var(--${c})">${h.s == null ? "no score" : h.s + (h.g?` &middot; ${esc(h.g)}`:"")}</span>
        </div>`;
      }).join("") + `</div>
      ${hist.length < 2 ? `<p style="margin:9px 0 0;font-size:12.5px;color:var(--ink3)">
        Only one dated visit is on file, so there is nothing to compare this against yet.</p>` : ""}
    </div>`;

    // ---- what the score is made of ------------------------------------
    html += `<div class="zone" id="found">
      <div class="lab">What this visit found</div>`;
    if (!viols.length){
      html += `<p style="margin:7px 0 0;font-size:13.5px;color:var(--ink2)">
        No violations were recorded on this visit${action ? ` &mdash; the city logged it as &ldquo;${esc(action)}&rdquo;` : ""}.
        That is not the same as a kitchen that was checked and found clean.</p>`;
    } else {
      html += `<div class="says" style="margin:2px 0 4px">
        <b>${viols.length}</b> violation${viols.length>1?"s":""} cited, <b>${crit}</b> of them critical.</div>`;
      const seen = new Set();
      for (const g of GROUPS){
        const mine = viols.filter(v => !seen.has(v) && g.test(v.violation_code || ""));
        mine.forEach(v => seen.add(v));
        if (!mine.length) continue;
        html += `<div class="grp"><h5>${g.h}<span class="cnt">${mine.length} of ${viols.length}</span></h5>
          <p>${g.note}</p>` + mine.map(v => `
          <div class="v">
            <span class="code">${esc(v.violation_code)}</span>
            ${v.critical_flag === "Critical" ? `<span class="crit">critical</span>` : ""}
            <span>${esc(v.violation_description || "(the city recorded no description)")}</span>
          </div>`).join("") + `</div>`;
      }
    }
    html += `</div>`;

    // ---- freshness -----------------------------------------------------
    const age = daysAgo(dates[0]);
    const stale = age > 365;
    html += `<div class="zone">
      <div class="fresh${stale?" stale":""}">
        <span>${stale
          ? `<b>This is ${Math.floor(age/365)} year${age>=730?"s":""} old.</b> The city has not published a newer
             inspection for this restaurant, so nothing here describes the kitchen today.`
          : `Newest inspection on file is <b>${age} days</b> old. The dataset itself was last updated
             <b>${modified ? esc(modified) : "at a time the API did not disclose"}</b>.`}</span>
      </div>
    </div>

    <div class="zone limits">
      <div class="lab">What this screen cannot tell you</div>
      <ul>
        <li><b>How the points were added up.</b> The city publishes the total and the violations, but not how many
            points each violation carried. So we can show you what was found, never the arithmetic.</li>
        <li><b>Whether it is clean right now.</b> Every line here is a record of one day an inspector visited.</li>
        <li><b>Anything about places that closed.</b> Only active restaurants are in this dataset, so the failures
            were removed before we ever saw them.</li>
      </ul>
      <div style="margin-top:11px;padding-top:10px;border-top:1px solid var(--rule)">
        <div class="lab">About the confidence rating</div>
        <p style="margin:7px 0 0;font-size:12.5px;color:var(--ink2)">
          This rating can&rsquo;t be bought or changed by a business. It changes when the city
          record changes or when we publish a new methodology version.</p>
        <p style="margin:7px 0 0;font-size:12.5px;color:var(--ink2)">
          <b>Validated before release:</b> In an untouched historical test, restaurants labeled
          Strong failed their next full inspection <b>${IRC.strongRatePct.toFixed(1)}%</b> of the time,
          compared with <b>${IRC.limitedRatePct.toFixed(1)}%</b> for Limited.</p>
        <p style="margin:7px 0 0;font-size:12.5px;color:var(--ink3)">
          Many recent records do not yet have a subsequent full inspection. Outcome rates are
          based only on observations whose next inspection was available:
          ${IRC.strongOutcomes.toLocaleString()} Strong and ${IRC.limitedOutcomes.toLocaleString()}
          Limited. All censored observations remain counted and disclosed.</p>
        <p style="margin:7px 0 0;font-size:12px;color:var(--ink3)">
          Methodology ${esc(IRC.methodologyVersion)} \u00b7 validated ${esc(IRC.validatedOn)} \u00b7
          registration <code>${esc(IRC.registration.slice(0,12))}</code> \u00b7
          <a href="https://github.com/doble196/freshroute-demo/blob/main/analysis/INSPECTION-RECORD-CONFIDENCE-PREREG.md">methodology</a> \u00b7
          <a href="https://github.com/doble196/freshroute-demo/blob/main/analysis/irc_validation_result.json">validation report</a> \u00b7
          <a href="https://github.com/doble196/freshroute-demo/blob/main/analysis/IRC-VALIDATION-PROTOCOL.md">limitations</a></p>
      </div>
    </div></div>`;

    settle(html);
    const sh = $("#actShare");
    if (sh) sh.addEventListener("click", () =>
      shareCard(head, grade || (band ? band.g : "\u2014"),
                IRC_LABEL[conf.state] || "Not applicable",
                IRC_COPY[conf.reason] || ""));
    const ac = $("#actCompare");
    if (ac) ac.addEventListener("click", () => {
      const t = tray();
      if (t.indexOf(head.camis) === -1){
        if (t.length >= 3){ $("#status").innerHTML =
          `<div class="msg">Compare holds three locations. Clear it to add more.</div>`; return; }
        setTray(t.concat([head.camis]));
      }
    });
  }

  function stampFoot(modified, stale){
    // A stamp always describes what is IN #out. When an error left the previous
    // answer on screen, the stamp still belongs to that older answer - so say so
    // rather than let a real timestamp vouch for the wrong thing.
    if (!stale) lastStamp = modified;
    $("#foot").innerHTML = (stale
      ? `<b style="color:var(--watch)">This stamp belongs to the result above, from the earlier
         search.</b> The search that just failed produced nothing to stamp.<br>` : "") +
      `Live from NYC OpenData, DOHMH Restaurant Inspection Results (<code>43nn-pn8j</code>), fetched in your browser
       when you searched. Publisher&rsquo;s last-modified stamp: <b>${modified ? esc(modified) : "not disclosed"}</b>.
       No API key is used or needed &mdash; a key embedded in a public page would be a key you have given away.
       Grade cut points (A 0&ndash;13, B 14&ndash;27, C 28+) are the city&rsquo;s. The grouping of violations into
       building versus handling is ours. Part of the <a href="index.html">DataHub</a>.`;
  }

  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#q").value.trim();
    if (v) search(v);
  });
  out.addEventListener("click", e => {
    const b = e.target.closest("button[data-camis]");
    if (b) show(b.dataset.camis);
  });
  document.querySelectorAll("[data-ex]").forEach(b =>
    b.addEventListener("click", () => { $("#q").value = b.dataset.ex; search(b.dataset.ex); }));

  paintTray();
  // Deep link: ?camis= names an exact physical location (the source ID), so
  // opening it directly is a selection, not a same-name guess.
  const wanted = new URLSearchParams(location.search).get("camis");
  if (wanted && /^\d{6,10}$/.test(wanted)) show(wanted);
  else search("EL SOL DE MEXICO");
})();
</script>
</body>
</html>
